<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)" />
    <title>Monitoreo de eventos · SIA-LIMA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <style>
      :root {
        --fondo: #f3f5f8; --superficie: #ffffff; --superficie-2: #f7f8fa;
        --texto: #151a23; --suave: #5f6878; --tenue: #8a93a3; --borde: #e3e7ee;
        --acento: #1a7f55; --acento-suave: #e6f4ee;
        --alerta: #c2362b; --alerta-suave: #fdecea;
        --aviso: #b26a00; --aviso-suave: #fff4e0;
        --sombra: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
        --radio: 12px;
        --mapa-filtro: grayscale(.55) contrast(.95) brightness(1.03);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fondo: #0d1014; --superficie: #151a21; --superficie-2: #1b212a;
          --texto: #e8ebf0; --suave: #a3acbb; --tenue: #717b8c; --borde: #262d38;
          --acento: #45c48b; --acento-suave: #133226;
          --alerta: #ff6f63; --alerta-suave: #3a1714;
          --aviso: #f0a63a; --aviso-suave: #3a2a10;
          --sombra: 0 1px 2px rgba(0,0,0,.4);
          --mapa-filtro: grayscale(.6) invert(.92) hue-rotate(180deg) brightness(.95) contrast(.9);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        background: var(--fondo); color: var(--texto);
        padding-bottom: env(safe-area-inset-bottom);
      }
      button { font: inherit; color: inherit; cursor: pointer; }

      header {
        position: sticky; top: 0; z-index: 1000;
        display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
        padding: 12px 24px; padding-top: max(12px, env(safe-area-inset-top));
        background: color-mix(in srgb, var(--superficie) 92%, transparent);
        backdrop-filter: saturate(1.4) blur(8px);
        border-bottom: 1px solid var(--borde);
      }
      .marca h1 { font-size: 17px; font-weight: 650; margin: 0; letter-spacing: -.01em; }
      .marca .sub { color: var(--suave); font-size: 12.5px; }
      .acciones { margin-left: auto; display: flex; align-items: center; gap: 8px; }
      .estado {
        display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px;
        border-radius: 999px; background: var(--superficie-2); border: 1px solid var(--borde);
        color: var(--suave); font-size: 12.5px; white-space: nowrap;
      }
      .estado .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--tenue); }
      .estado.vivo { color: var(--acento); background: var(--acento-suave); border-color: transparent; }
      .estado.vivo .punto { background: var(--acento); animation: latido 2s infinite; }
      .estado.error { color: var(--alerta); background: var(--alerta-suave); border-color: transparent; }
      .estado.error .punto { background: var(--alerta); }
      @keyframes latido { 0%,100%{opacity:1} 50%{opacity:.35} }
      .boton {
        display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px;
        background: var(--superficie); border: 1px solid var(--borde); border-radius: 8px;
        box-shadow: var(--sombra);
      }
      .boton[aria-pressed="true"] { background: var(--acento); border-color: var(--acento); color: #fff; }

      .contenedor { max-width: 1440px; margin: 0 auto; padding: 20px 24px 24px; }
      .resumen { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
      .kpi {
        background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio);
        padding: 14px 16px; box-shadow: var(--sombra);
      }
      .kpi .etiqueta { color: var(--suave); font-size: 12.5px; }
      .kpi .valor { font-size: 20px; font-weight: 650; }

      .cuerpo { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; height: calc(100vh - 210px); min-height: 460px; }
      .tarjeta {
        background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio);
        box-shadow: var(--sombra); display: flex; flex-direction: column; overflow: hidden; min-height: 0;
      }
      .tarjeta-cab { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--borde); }
      .tarjeta-cab h2 { font-size: 14px; margin: 0; }
      .tarjeta-cab .nota { color: var(--tenue); font-size: 12.5px; }
      #mapa { flex: 1; min-height: 300px; background: var(--superficie-2); }
      #mapa .leaflet-tile-pane { filter: var(--mapa-filtro); }

      .lista { overflow-y: auto; flex: 1; padding: 6px 8px 10px; }
      .evento { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 10px 8px; border-radius: 10px; }
      .evento.nuevo { background: var(--alerta-suave); }
      .evento .icono { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--acento-suave); color: var(--acento); font-size: 18px; }
      .evento.nuevo .icono { background: var(--alerta); color: #fff; }
      .evento .titulo { font-weight: 600; }
      .evento .meta { color: var(--suave); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
      .chip { display: inline-flex; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; background: var(--superficie-2); color: var(--suave); }
      .chip.ambar { background: var(--aviso-suave); color: var(--aviso); }
      .evento .hace { color: var(--tenue); font-size: 12px; white-space: nowrap; }
      .vacio { color: var(--tenue); text-align: center; padding: 40px 12px; }
    </style>
  </head>
  <body>
    <header>
      <div class="marca">
        <h1>Monitoreo de eventos · SIA-LIMA</h1>
        <div class="sub">Lectura en vivo por MQTT, sin servidor intermedio</div>
      </div>
      <div class="acciones">
        <span class="estado" id="estado"><span class="punto"></span><span id="texto-estado">Conectando…</span></span>
        <button class="boton" id="btn-alertas" aria-pressed="false">🔔 Alertas</button>
        <button class="boton" id="btn-exportar">⬇ Exportar</button>
      </div>
    </header>

    <div class="contenedor">
      <div class="resumen">
        <div class="kpi"><div class="etiqueta">Eventos hoy</div><div class="valor" id="kpi-hoy">0</div></div>
        <div class="kpi"><div class="etiqueta">Último evento</div><div class="valor" id="kpi-ultimo">—</div></div>
        <div class="kpi"><div class="etiqueta">Total recibidos (sesión)</div><div class="valor" id="kpi-total">0</div></div>
        <div class="kpi"><div class="etiqueta">Broker</div><div class="valor" id="kpi-broker">broker.hivemq.com</div></div>
      </div>

      <div class="cuerpo">
        <div class="tarjeta">
          <div class="tarjeta-cab"><h2>Mapa</h2><span class="nota" id="nota-mapa"></span></div>
          <div id="mapa"></div>
        </div>
        <div class="tarjeta">
          <div class="tarjeta-cab"><h2>Eventos recientes</h2><span class="nota" id="total"></span></div>
          <div class="lista" id="eventos"></div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.16.1/mqtt.min.js"></script>
    <script>
      // ---------------------------------------------------------------- configuración
      // Mismo broker público y mismo tópico que usa el ESP32 (ver main.cpp).
      // Cambia el código de estudiante si corresponde.
      const BROKER_URL = "wss://broker.hivemq.com:8884/mqtt";
      const TOPIC = "unfv/proyectoiot/2023024243/alertas";
      const MAX_EVENTOS = 200;
      const PULSO_MS = 60000; // un evento se resalta como "nuevo" durante 1 minuto
      const CLAVE_GUARDADO = "sia_lima_eventos_v1";

      const $ = (id) => document.getElementById(id);

      function leer(clave) { try { return localStorage.getItem(clave); } catch { return null; } }
      function guardar(clave, valor) { try { localStorage.setItem(clave, valor); } catch {} }

      // ---------------------------------------------------------------- mapa
      const mapa = L.map("mapa").setView([-12.0464, -77.0428], 12);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: "&copy; OpenStreetMap"
      }).addTo(mapa);
      const capa = L.layerGroup().addTo(mapa);

      // ---------------------------------------------------------------- estado
      let eventos = [];
      let alertasActivas = leer("sia_lima_alertas") === "1";
      let audioCtx = null;
      let centrado = false;

      try {
        const guardados = JSON.parse(leer(CLAVE_GUARDADO) || "[]");
        if (Array.isArray(guardados)) eventos = guardados.slice(-MAX_EVENTOS);
      } catch {}

      function nombreTipo(t) {
        const s = (t || "evento").replaceAll("_", " ");
        return s.charAt(0).toUpperCase() + s.slice(1);
      }
      function horaCorta(ms) { return new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }); }
      function hace(ms) {
        const s = Math.max(0, (Date.now() - ms) / 1000);
        if (s < 60) return "ahora";
        if (s < 3600) return `hace ${Math.floor(s / 60)} min`;
        if (s < 86400) return `hace ${Math.floor(s / 3600)} h`;
        return `hace ${Math.floor(s / 86400)} d`;
      }

      function ponerEstado(clase, texto) {
        const el = $("estado");
        el.className = "estado" + (clase ? " " + clase : "");
        $("texto-estado").textContent = texto;
      }

      function sonarAlerta() {
        if (!alertasActivas) return;
        try {
          audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.2, audioCtx.currentTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        } catch {}
      }

      function alternarAlertas() {
        alertasActivas = !alertasActivas;
        guardar("sia_lima_alertas", alertasActivas ? "1" : "0");
        $("btn-alertas").setAttribute("aria-pressed", String(alertasActivas));
      }
      $("btn-alertas").setAttribute("aria-pressed", String(alertasActivas));
      $("btn-alertas").addEventListener("click", alternarAlertas);
      document.addEventListener("pointerdown", () => {
        if (alertasActivas && !audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
      }, { once: true });

      function exportar() {
        if (!eventos.length) return;
        const filas = [["tipo", "fecha_hora", "lat", "lng", "gps_valido"]];
        for (const e of eventos) {
          filas.push([e.tipo, new Date(e.ts).toLocaleString(), e.lat ?? "", e.lng ?? "", e.fix ? "si" : "no"]);
        }
        const csv = filas.map((f) => f.map((v) => `"${String(v).replaceAll('"', '""')}"`).join(",")).join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "sia-lima-eventos.csv";
        a.click();
      }
      $("btn-exportar").addEventListener("click", exportar);

      // ---------------------------------------------------------------- dibujo
      function dibujarEventos() {
        const cont = $("eventos");
        cont.replaceChildren();
        capa.clearLayers();

        const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
        const eventosHoy = eventos.filter((e) => new Date(e.ts) >= hoy).length;
        $("kpi-hoy").textContent = eventosHoy;
        $("kpi-total").textContent = eventos.length;
        $("kpi-ultimo").textContent = eventos.length ? hace(eventos[eventos.length - 1].ts) : "—";

        const conUbicacion = eventos.filter((e) => e.lat !== null && e.lat !== undefined).length;
        $("total").textContent = eventos.length ? `${eventos.length} mostrados` : "";
        $("nota-mapa").textContent = eventos.length ? `${conUbicacion} de ${eventos.length} con ubicación` : "";

        if (!eventos.length) {
          const v = document.createElement("div");
          v.className = "vacio";
          v.textContent = "Sin eventos todavía. Esperando que el nodo detecte un sonido fuerte…";
          cont.append(v);
          return;
        }

        const ahora = Date.now();
        for (const ev of [...eventos].reverse()) {
          const nuevo = ev._nuevoHasta && ahora < ev._nuevoHasta;
          const fila = document.createElement("div");
          fila.className = "evento" + (nuevo ? " nuevo" : "");

          const ic = document.createElement("div");
          ic.className = "icono";
          ic.textContent = "〜";

          const centro = document.createElement("div");
          const titulo = document.createElement("div");
          titulo.className = "titulo";
          titulo.textContent = nombreTipo(ev.tipo);
          const meta = document.createElement("div");
          meta.className = "meta";
          const spanHora = document.createElement("span");
          spanHora.textContent = horaCorta(ev.ts);
          meta.append(spanHora);
          if (ev.lat === null || ev.lat === undefined) {
            const chip = document.createElement("span");
            chip.className = "chip";
            chip.textContent = "Sin ubicación";
            meta.append(chip);
          } else if (!ev.fix) {
            const chip = document.createElement("span");
            chip.className = "chip ambar";
            chip.textContent = "Última posición conocida";
            meta.append(chip);
          }
          centro.append(titulo, meta);

          const der = document.createElement("div");
          der.className = "hace";
          der.textContent = hace(ev.ts);

          fila.append(ic, centro, der);
          cont.append(fila);

          if (ev.lat !== null && ev.lat !== undefined) {
            const color = nuevo ? "#c2362b" : (ev.fix ? "#1a7f55" : "#b26a00");
            const m = L.circleMarker([ev.lat, ev.lng], { radius: nuevo ? 10 : 7, color: "#fff", weight: 2, fillColor: color, fillOpacity: .95 });
            m.bindPopup(`<strong>${nombreTipo(ev.tipo)}</strong><br>${new Date(ev.ts).toLocaleString()}`);
            m.addTo(capa);
          }
        }

        const ultimoConUbic = [...eventos].reverse().find((e) => e.lat !== null && e.lat !== undefined);
        if (ultimoConUbic && !centrado) { mapa.setView([ultimoConUbic.lat, ultimoConUbic.lng], 15); centrado = true; }
      }

      function agregarEvento(datos) {
        const ev = {
          tipo: datos.tipo || "evento_acustico",
          ts: datos.timestamp_ms ? Date.now() : Date.now(), // se usa la hora de llegada (más confiable que millis() del ESP32)
          lat: typeof datos.lat === "number" ? datos.lat : null,
          lng: typeof datos.lng === "number" ? datos.lng : null,
          fix: !!datos.gps_valido,
          _nuevoHasta: Date.now() + PULSO_MS,
        };
        eventos.push(ev);
        if (eventos.length > MAX_EVENTOS) eventos = eventos.slice(-MAX_EVENTOS);
        guardar(CLAVE_GUARDADO, JSON.stringify(eventos.map((e) => ({ tipo: e.tipo, ts: e.ts, lat: e.lat, lng: e.lng, fix: e.fix }))));
        sonarAlerta();
        dibujarEventos();
      }

      // ---------------------------------------------------------------- conexión MQTT
      const clientId = "sia-lima-web-" + Math.random().toString(16).slice(2, 10);
      const client = mqtt.connect(BROKER_URL, { clientId, reconnectPeriod: 3000 });

      client.on("connect", () => {
        ponerEstado("vivo", "En vivo · " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
        client.subscribe(TOPIC);
      });
      client.on("reconnect", () => ponerEstado("", "Reconectando…"));
      client.on("close", () => ponerEstado("error", "Desconectado"));
      client.on("error", (err) => ponerEstado("error", "Error: " + (err && err.message ? err.message : "conexión")));
      client.on("message", (_topic, payload) => {
        try {
          agregarEvento(JSON.parse(payload.toString()));
        } catch (e) {
          console.error("Mensaje MQTT no válido:", e);
        }
      });

      // ---------------------------------------------------------------- inicio
      dibujarEventos();
      setInterval(dibujarEventos, 30000); // refresca los "hace X min" aunque no lleguen datos nuevos
    </script>
  </body>
</html>
